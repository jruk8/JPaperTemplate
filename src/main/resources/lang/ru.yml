  languageAuto: "{prefix}{plain}Язык снова следует за клиентом: {hl}{name}{plain}."
  languageUnknown: "{prefix}{error}Неизвестный язык {hl}{input}{error}. Используй {hl}{codes}{error} или {hl}auto{error}."
help:
  help: "Показывает это меню помощи."
  version: "Показывает версию плагина."
