  noTargets: "{prefix}{error}Ни один игрок не подошёл под этот селектор."
  consoleNeedsTarget: "{prefix}{error}Консоль должна указать цель."
  playerOnly: "{prefix}{error}Только игроки могут использовать эту команду."
