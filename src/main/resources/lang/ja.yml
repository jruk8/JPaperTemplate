  noTargets: "{prefix}{error}そのセレクターに一致するプレイヤーがいません。"
  consoleNeedsTarget: "{prefix}{error}コンソールは対象を指定する必要があります。"
  playerOnly: "{prefix}{error}このコマンドはプレイヤーのみ使用できます。"
  linkModrinth: "<click:open_url:'{url}'><hover:show_text:'<#5ae663>Modrinthで開く'><#5ae663>Modrinth</hover></click>"
  linkGithub: "<click:open_url:'{url}'><hover:show_text:'<#5a88e6>GitHubで開く'><#5a88e6>GitHub</hover></click>"
  linkDiscord: "<click:open_url:'{url}'><hover:show_text:'<#6258f2>Discordに参加'><#6258f2>Discord</hover></click>"
  linkDonate: "<click:open_url:'{url}'><hover:show_text:'<#ff5e5b>Ko-fiで支援'><#ff5e5b>寄付</hover></click>"
  versionComma: "<gray>、</gray>"
  versionAnd: "<gray>と</gray>"
  languageShow: "{prefix}{plain}言語：{hl}{name}{plain}。"
  languageShowAuto: "{prefix}{plain}言語はクライアントに従います：{hl}{name}{plain}。"
