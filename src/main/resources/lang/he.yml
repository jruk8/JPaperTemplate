  updateAvailable: "\\n{prefix}{hl}JTemplate {latest}{brand} זמין (פועל {hl}{current}{brand}).\\n{brand}» {hl}עדכון: {modrinth} {plain}| {github} {plain}| {discord}"
  noPermission: "{prefix}{error}חסרה לך ההרשאה {hl}'{permission}'{error} לפקודה זו."
  noTargets: "{prefix}{error}אף שחקן לא תואם לסלקטור הזה."
  consoleNeedsTarget: "{prefix}{error}המסוף חייב לציין מטרה."
  playerOnly: "{prefix}{error}רק שחקנים יכולים להשתמש בפקודה זו."
  linkModrinth: "<click:open_url:'{url}'><hover:show_text:'<#5ae663>פתיחה ב-Modrinth'><#5ae663>Modrinth</hover></click>"
  linkGithub: "<click:open_url:'{url}'><hover:show_text:'<#5a88e6>פתיחה ב-GitHub'><#5a88e6>GitHub</hover></click>"
  linkDiscord: "<click:open_url:'{url}'><hover:show_text:'<#6258f2>הצטרפות לדיסקורד'><#6258f2>Discord</hover></click>"
  linkDonate: "<click:open_url:'{url}'><hover:show_text:'<#ff5e5b>תמיכה ב-Ko-fi'><#ff5e5b>תרומה</hover></click>"
  versionComma: "<gray>,</gray>"
  versionAnd: "<gray>ו</gray>"
  languageShow: "{prefix}{plain}שפה: {hl}{name}{plain}."
  languageShowAuto: "{prefix}{plain}השפה עוקבת אחר הלקוח שלך: {hl}{name}{plain}."
