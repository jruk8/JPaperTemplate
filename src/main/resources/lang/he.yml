  languageAuto: "{prefix}{plain}השפה שוב עוקבת אחר הלקוח שלך: {hl}{name}{plain}."
  languageUnknown: "{prefix}{error}שפה לא מוכרת {hl}{input}{error}. השתמש ב{hl}{codes}{error} או ב{hl}auto{error}."
help:
  help: "מציג תפריט עזרה זה."
  version: "מציג את גרסת התוסף."
