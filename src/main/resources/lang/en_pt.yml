prefix: "<#a6a6a6>[<gradient:#8fdde3:#84b8db><bold>J</bold>Template</gradient>]</#a6a6a6> "
core:
  reloadSuccess: "\\n{prefix}{plain}Config reloaded in {hl}{time}ms{plain}. Fair winds!"
  reloadFailure: "{prefix}{error}Reload failed in {time}ms. Check the console, matey."
  reloadRestartRequired: "{prefix}{hl}Reload done. {plain}Command name changes need a server restart."
  helpHeader: "\\n{prefix}{brand}JTemplate {version} Help:"
  helpEntryFormat: "{brand}» {hl}{syntax}{plain}: {description}"
  versionSuccess: "\\n{prefix}{brand}Version {hl}{version}\\n{brand}» {hl}Made by: {plain}{authors}\\n{brand}» {hl}Links: {modrinth}{plain} | {github}{plain} | {donate}"
  updateAvailable: "\\n{prefix}{hl}JTemplate {latest}{brand} be out (ye be on {hl}{current}{brand}).\\n{brand}» {hl}Upgraydd: {modrinth} {plain}| {github} {plain}| {discord}"
  noPermission: "{prefix}{error}Ye lack the permission {hl}'{permission}'{error} to use this command."
  noTargets: "{prefix}{error}No sailors matched that selector."
  consoleNeedsTarget: "{prefix}{error}Console must name a target, arr."
  playerOnly: "{prefix}{error}Only players may use this, arr."
  linkModrinth: "<click:open_url:'{url}'><hover:show_text:'<#5ae663>Open on Modrinth'><#5ae663>Modrinth</hover></click>"
  linkGithub: "<click:open_url:'{url}'><hover:show_text:'<#5a88e6>Open on GitHub'><#5a88e6>GitHub</hover></click>"
  linkDiscord: "<click:open_url:'{url}'><hover:show_text:'<#6258f2>Join the Discord'><#6258f2>Discord</hover></click>"
  linkDonate: "<click:open_url:'{url}'><hover:show_text:'<#ff5e5b>Donate on Ko-fi'><#ff5e5b>Donate</hover></click>"
  versionComma: "<gray>,</gray>"
  versionAnd: "<gray>and</gray>"
  languageShow: "{prefix}{plain}Language: {hl}{name}{plain}."
  languageShowAuto: "{prefix}{plain}Language follows yer client: {hl}{name}{plain}."
  languageSet: "{prefix}{plain}Language set to {hl}{name}{plain}. No longer follows client."
  languageAuto: "{prefix}{plain}Language follows client again: {hl}{name}{plain}."
  languageUnknown: "{prefix}{error}What tongue be {hl}{input}{error}? Use {hl}{codes}{error} or {hl}auto{error}."
help:
  help: "Show this help menu."
  version: "Show the plugin version."
  reload: "Reload the plugin config."
  language: "Show or set yer language."
