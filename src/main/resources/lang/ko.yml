  linkDiscord: "<click:open_url:'{url}'><hover:show_text:'<#6258f2>Discord 참가'><#6258f2>Discord</hover></click>"
  linkDonate: "<click:open_url:'{url}'><hover:show_text:'<#ff5e5b>Ko-fi에서 후원'><#ff5e5b>후원</hover></click>"
