  reloadFailure: "{prefix}{error}重载失败，耗时 {time}ms。请查看控制台。"
  reloadRestartRequired: "{prefix}{hl}重载完成。{plain}命令名称更改需要重启服务器。"
  helpHeader: "\\n{prefix}{brand}JTemplate {version} 帮助："
