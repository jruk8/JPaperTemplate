  noPermission: "{prefix}{error}你没有权限 {hl}'{permission}'{error} 来使用此命令。"
  noTargets: "{prefix}{error}没有玩家匹配该选择器。"
  consoleNeedsTarget: "{prefix}{error}控制台必须指定目标。"
  playerOnly: "{prefix}{error}只有玩家可以使用此命令。"
  linkModrinth: "<click:open_url:'{url}'><hover:show_text:'<#5ae663>在 Modrinth 上打开'><#5ae663>Modrinth</hover></click>"
  linkGithub: "<click:open_url:'{url}'><hover:show_text:'<#5a88e6>在 GitHub 上打开'><#5a88e6>GitHub</hover></click>"
  linkDiscord: "<click:open_url:'{url}'><hover:show_text:'<#6258f2>加入 Discord'><#6258f2>Discord</hover></click>"
  linkDonate: "<click:open_url:'{url}'><hover:show_text:'<#ff5e5b>在 Ko-fi 上支持'><#ff5e5b>捐助</hover></click>"
  versionComma: "<gray>、</gray>"
  versionAnd: "<gray>和</gray>"
  languageShow: "{prefix}{plain}语言：{hl}{name}{plain}。"
  languageShowAuto: "{prefix}{plain}语言跟随客户端：{hl}{name}{plain}。"
  languageSet: "{prefix}{plain}语言已设为 {hl}{name}{plain}，不再跟随客户端。"
  languageAuto: "{prefix}{plain}语言恢复跟随客户端：{hl}{name}{plain}。"
  languageUnknown: "{prefix}{error}未知语言 {hl}{input}{error}。请使用 {hl}{codes}{error} 或 {hl}auto{error}。"
help:
  help: "显示此帮助菜单。"
