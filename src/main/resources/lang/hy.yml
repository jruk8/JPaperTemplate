prefix: "<#a6a6a6>[<gradient:#8fdde3:#84b8db><bold>J</bold>Template</gradient>]</#a6a6a6> "
core:
  reloadSuccess: "\\n{prefix}{plain}Կարգավորումը վերաբեռնվեց {hl}{time}ms{plain}-ում։"
  reloadFailure: "{prefix}{error}Վերաբեռնումը ձախողվեց {time}ms-ում։ Ստուգիր կոնսոլը։"
  reloadRestartRequired: "{prefix}{hl}Բեռնումն ավարտվեց։ {plain}Հրամանների անունների փոփոխությունը պահանջում է վերագործարկում։"
  helpHeader: "\\n{prefix}{brand}JTemplate {version} Օգնություն։"
  helpEntryFormat: "{brand}» {hl}{syntax}{plain}: {description}"
  helpNoMatch: "{prefix}{plain}Ոչ մի հրաման չի համապատասխանում այս հարցմանը։"
  helpNoCommands: "{prefix}{plain}Քեզ համար հասանելի հրամաններ չկան։"
  versionSuccess: "\\n{prefix}{brand}Տարբերակ {hl}{version}\\n{brand}» {hl}Հեղինակներ։ {plain}{authors}\\n{brand}» {hl}Հղումներ։ {modrinth}{plain} | {github}{plain} | {donate}"
  updateAvailable: "\\n{prefix}{hl}JTemplate {latest}{brand} հասանելի է (աշխատում է {hl}{current}{brand})։\\n{brand}» {hl}Թարմացրու։ {modrinth} {plain}| {github} {plain}| {discord}"
  noPermission: "{prefix}{error}Քեզ պակասում է {hl}'{permission}'{error} թույլտվությունն այս հրամանի համար։"
  noTargets: "{prefix}{error}Ոչ մի խաղացող չի համապատասխանում այս ընտրիչին։"
  consoleNeedsTarget: "{prefix}{error}Կոնսոլը պետք է նշի թիրախ։"
  playerOnly: "{prefix}{error}Այս հրամանը կարող են օգտագործել միայն խաղացողները։"
  linkModrinth: "<click:open_url:'{url}'><hover:show_text:'<#5ae663>Բացել Modrinth-ում'><#5ae663>Modrinth</hover></click>"
  linkGithub: "<click:open_url:'{url}'><hover:show_text:'<#5a88e6>Բացել GitHub-ում'><#5a88e6>GitHub</hover></click>"
  linkDiscord: "<click:open_url:'{url}'><hover:show_text:'<#6258f2>Միացիր Discord-ին'><#6258f2>Discord</hover></click>"
  linkDonate: "<click:open_url:'{url}'><hover:show_text:'<#ff5e5b>Աջակցել Ko-fi-ում'><#ff5e5b>Աջակցել</hover></click>"
  versionComma: "<gray>,</gray>"
  versionAnd: "<gray>և</gray>"
  languageShow: "{prefix}{plain}Լեզուն։ {hl}{name}{plain}։"
  languageShowAuto: "{prefix}{plain}Լեզուն հետևում է քո քլայենթին։ {hl}{name}{plain}։"
  languageSet: "{prefix}{plain}Լեզուն դրվեց։ {hl}{name}{plain}։ Այլևս չի հետևի քլայենթին։"
  languageAuto: "{prefix}{plain}Լեզուն նորից հետևում է քո քլայենթին։ {hl}{name}{plain}։"
  languageUnknown: "{prefix}{error}Անհայտ լեզու {hl}{input}{error}։ Օգտագործիր {hl}{codes}{error} կամ {hl}auto{error}։"
help:
  help: "Ցուցադրում է այս օգնության մենյուն։"
  version: "Ցուցադրում է փլագինի տարբերակը։"
  reload: "Վերաբեռնում է փլագինի կարգավորումը։"
  language: "Ցուցադրում կամ դնում է քո լեզուն։"
